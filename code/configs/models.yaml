# One fixed checkpoint per model, pinned to a commit, used in every condition
# (paired comparisons must see identical weights). See design.md Sec. 8.
#
# family: prompt format implemented in coldrank/llm/chat.py
# max_model_len: 4096 for every listwise model (parity); Phi-2 is 2048.
# listwise: false -> pointwise only (context too small for a 50-candidate prompt)

phi2:
  hf_id: microsoft/phi-2
  revision: 810d367871c1d460086d9f82db8696f2e0a0fcd0
  quantization: null          # fp16 (~5.5 GB)
  family: phi2
  max_model_len: 2048
  listwise: false
  trust_remote_code: false

llama2_7b:
  hf_id: TheBloke/Llama-2-7B-Chat-AWQ
  revision: ee91097dc818c742d9b648147891dfadd9638ace
  quantization: awq
  family: llama2
  max_model_len: 4096
  listwise: true
  trust_remote_code: false

llama2_13b:
  hf_id: TheBloke/Llama-2-13B-chat-AWQ
  revision: e609cfc317ae4da50bb1839b8dcc3bf3a65f0fb7
  quantization: awq
  family: llama2
  max_model_len: 4096
  listwise: true
  trust_remote_code: false

mistral_7b:
  hf_id: TheBloke/Mistral-7B-Instruct-v0.1-AWQ
  revision: b2f7c152209c12057c3a0d77b2c01a1def7d594f
  quantization: awq
  family: mistral
  max_model_len: 4096          # native 8k, capped for parity
  listwise: true
  trust_remote_code: false
  vllm:
    # Mistral v0.1 uses 4,096-token sliding-window attention, which vLLM cannot combine with
    # prefix caching. With max_model_len = 4096 = the window, no token ever leaves the window,
    # so disabling it gives identical attention.
    disable_sliding_window: true

qwen_7b:
  hf_id: Qwen/Qwen-7B-Chat-Int4
  revision: 5a9a1ed9203a3d4ccc62f24fbb9b7e3948ce8ec1
  quantization: gptq
  family: chatml
  max_model_len: 4096          # native 8k, capped for parity
  listwise: true
  trust_remote_code: true      # Qwen v1 ships custom modeling/tokenizer code (needs `tiktoken`)

# Li et al.'s own base model (Qwen-2.5-32B-Instruct, their Sec. 3.2), 4-bit AWQ, split across the
# 4 GPUs of a node (tensor parallel). Released 2024: relaxes the 2023-only rule (team decision,
# 2026-10-23; design.md). Context 8k instead of 4k: the reasoning prompts fit without trimming.
qwen25_32b:
  hf_id: Qwen/Qwen2.5-32B-Instruct-AWQ
  revision: 5c7cb76a268fc6cfbb9c4777eb24ba6e27f9ee6c
  quantization: awq
  family: chatml
  max_model_len: 8192
  listwise: true
  trust_remote_code: false
  vllm:
    tensor_parallel_size: 4
  gen_cap:                    # output cap per method (default prompts.render.GEN_CAP, set for 4k models):
    structural: 2048          # its reasoning ran out at 1,024 tokens in 25-40% of smoke outputs
    structural_norecency: 2048
    ssc: 2048

# Local CPU smoke tests only (not a study model).
smol_135m:
