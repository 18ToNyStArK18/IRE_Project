# Dates-hidden control (finetune_nodates.yaml): llama2_7b_ft_amazon_vg's data and settings with every
# displayed date removed from the training prompts; evaluated on A3 (design.md).
llama2_7b_ftnodates_amazon_vg:
  base: llama2_7b_fp16
  adapter: outputs/finetune/amazon_vg/llama2_7b_nodates/adapter
  family: llama2
  max_model_len: 4096
  listwise: false
  trust_remote_code: false
  vllm:
    tensor_parallel_size: 2

# --- fine-tuning experiment, Qwen2.5-7B-Instruct (Amazon: 2026-10-26, ada-sanjith; EB-NeRD: 2026-10-28) ---
# Ungated fp16 base for QLoRA (4-bit at training, as for Llama-2). On one 11 GB GPU vLLM loads the
# fp16 weights 4-bit at load time (bitsandbytes) instead of TP = 2; the zero-shot reference and the
# fine-tuned model use the same setting, so before/after see the same quantization. fp16 compute:
# Turing has no bf16 (check the training loss for overflow).
qwen25_7b_fp16:
  hf_id: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  allow_patterns: ["*.json", "*.safetensors", "merges.txt"]
  quantization: bitsandbytes
  family: chatml
  max_model_len: 4096
  listwise: false
  trust_remote_code: false
  # fast-vs-exact pointwise check (llm.run --verify-pointwise): bitsandbytes 4-bit adds batch-dependent
  # rounding, 0.06-0.09 log-odds on these prompts, so the absolute tolerance is 0.15 (default 0.05)
  verify_tol: 0.15

qwen25_7b_ft_amazon_vg:
  base: qwen25_7b_fp16
  adapter: outputs/finetune/amazon_vg/qwen25_7b/adapter   # relative to the project directory
  quantization: bitsandbytes
  verify_tol: 0.15                                          # see qwen25_7b_fp16
  family: chatml
  max_model_len: 4096
  listwise: false
  trust_remote_code: false

# Same settings as qwen25_7b_ft_amazon_vg (finetune_qwen25_ada.yaml, 4 GPUs; replaces the earlier
# exploratory pkgpu bf16 entry, which never ran).
qwen25_7b_ft_ebnerd:
  base: qwen25_7b_fp16
  adapter: outputs/finetune/ebnerd/qwen25_7b/adapter
  quantization: bitsandbytes
  verify_tol: 0.15
  # its log-odds on wrong candidates are about -18, so "Yes" falls below the default top-500 list
  # the exact check reads (job 45077); 150,000 of Qwen2.5's 152,064 logits covers it
  exact_topk: 150000
  family: chatml
  max_model_len: 4096
  listwise: false
  trust_remote_code: false

# Qwen2.5-7B fine-tuned on EB-NeRD with impression negatives (finetune_qwen25_7b_imp.yaml): same
# settings as qwen25_7b_ft_ebnerd, so the zero-shot, pool-data and impression models compare directly.
qwen25_7b_ftimp_ebnerd:
  base: qwen25_7b_fp16
  adapter: outputs/finetune/ebnerd/qwen25_7b_imp/adapter
  quantization: bitsandbytes
  verify_tol: 0.15
  exact_topk: 150000  # as qwen25_7b_ft_ebnerd (a sharply fine-tuned Qwen puts "Yes" below the top 500)
  family: chatml
  max_model_len: 4096
  listwise: false
  trust_remote_code: false
