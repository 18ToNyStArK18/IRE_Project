# One fixed checkpoint per model, pinned to a commit, used in every condition
# (paired comparisons must see identical weights). See design.md Sec. 8.
#
# family: prompt format implemented in coldrank/llm/chat.py
# max_model_len: 4096 for every listwise model (parity); Phi-2 is 2048.
# listwise: false -> pointwise only (context too small for a 50-candidate prompt)

phi2:
  hf_id: microsoft/phi-2
  revision: 810d367871c1d460086d9f82db8696f2e0a0fcd0
  quantization: null          # fp16 (~5.5 GB)
  family: phi2
  max_model_len: 2048
  listwise: false
  trust_remote_code: false

llama2_7b:
  hf_id: TheBloke/Llama-2-7B-Chat-AWQ
  revision: ee91097dc818c742d9b648147891dfadd9638ace
  quantization: awq
  family: llama2
  max_model_len: 4096
  listwise: true
  trust_remote_code: false

llama2_13b:
  hf_id: TheBloke/Llama-2-13B-chat-AWQ
  revision: e609cfc317ae4da50bb1839b8dcc3bf3a65f0fb7
  quantization: awq
  family: llama2
  max_model_len: 4096
  listwise: true
  trust_remote_code: false

mistral_7b:
  hf_id: TheBloke/Mistral-7B-Instruct-v0.1-AWQ
  revision: b2f7c152209c12057c3a0d77b2c01a1def7d594f
  quantization: awq
  family: mistral
  max_model_len: 4096          # native 8k, capped for parity
  listwise: true
  trust_remote_code: false
  vllm:
    # Mistral v0.1 uses 4,096-token sliding-window attention, which vLLM cannot combine with
    # prefix caching. With max_model_len = 4096 = the window, no token ever leaves the window,
    # so disabling it gives identical attention.
    disable_sliding_window: true

qwen_7b:
  hf_id: Qwen/Qwen-7B-Chat-Int4
  revision: 5a9a1ed9203a3d4ccc62f24fbb9b7e3948ce8ec1
  quantization: gptq
  family: chatml
  max_model_len: 4096          # native 8k, capped for parity
  listwise: true
  trust_remote_code: true      # Qwen v1 ships custom modeling/tokenizer code (needs `tiktoken`)

# Exploratory (pkgpu, 2026-10-23): released Sept 2024, so OUTSIDE the 2023-only model scope
# (design.md Sec. 7); not a study model until the team decides.
qwen25_7b:
  hf_id: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  quantization: null           # full weights (~15 GB); pkgpu RTX 5000 Ada, 32 GB
  dtype: bfloat16              # trained in bf16; the fp16 default is only for the 2080 Ti (no bf16)
  family: chatml
  max_model_len: 4096          # native 32k, capped for parity
  listwise: true
  trust_remote_code: false

# Li et al.'s own base model (Qwen-2.5-32B-Instruct, their Sec. 3.2), 4-bit AWQ, split across the
# 4 GPUs of a node (tensor parallel). Released 2024: relaxes the 2023-only rule (team decision,
# 2026-10-23; design.md). Context 8k instead of 4k: the reasoning prompts fit without trimming.
qwen25_32b:
  hf_id: Qwen/Qwen2.5-32B-Instruct-AWQ
  revision: 5c7cb76a268fc6cfbb9c4777eb24ba6e27f9ee6c
  quantization: awq
  family: chatml
  max_model_len: 8192
  listwise: true
  trust_remote_code: false
  vllm:
    tensor_parallel_size: 4
  gen_cap:                    # output cap per method (default prompts.render.GEN_CAP, set for 4k models):
    structural: 2048          # its reasoning ran out at 1,024 tokens in 25-40% of smoke outputs
    structural_norecency: 2048
    ssc: 2048

# Local CPU smoke tests only (not a study model).
smol_135m:
  hf_id: HuggingFaceTB/SmolLM2-135M-Instruct
  revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  quantization: null
  family: chatml
  max_model_len: 4096
  listwise: true
  trust_remote_code: false

# --- fine-tuning experiment (design.md "Fine-tuning experiment") ---
# Full-precision Llama-2-7B-Chat: the base for QLoRA, and the zero-shot reference with the same
# weights as the fine-tuned models. fp16 (13.5 GB) needs 2 GPUs of 11 GB.
llama2_7b_fp16:
  hf_id: meta-llama/Llama-2-7b-chat-hf
  revision: f5db02db724555f92da89c216ac04704f23d4590
  allow_patterns: ["*.json", "*.safetensors", "tokenizer.model"]   # the repo also has .bin copies (13.5 GB more)
  quantization: null
  family: llama2
  max_model_len: 4096
  listwise: false
  trust_remote_code: false
  vllm:
    tensor_parallel_size: 2

# Fine-tuned models: the LoRA adapter is merged into `base` before loading (coldrank.finetune.merge).
llama2_7b_ft_amazon_vg:
  base: llama2_7b_fp16
  adapter: outputs/finetune/amazon_vg/llama2_7b/adapter   # relative to the project directory
  family: llama2
  max_model_len: 4096
  listwise: false
  trust_remote_code: false
  vllm:
    tensor_parallel_size: 2

llama2_7b_ft_ebnerd:
  base: llama2_7b_fp16
  adapter: outputs/finetune/ebnerd/llama2_7b/adapter
  family: llama2
  max_model_len: 4096
  listwise: false
  trust_remote_code: false
  vllm:
    tensor_parallel_size: 2

# Exploratory (pkgpu, one RTX 5000 Ada): Qwen2.5-7B fine-tuned on EB-NeRD; bf16 (15 GB) fits one GPU.
qwen25_7b_ft_ebnerd:
  base: qwen25_7b
  adapter: outputs/finetune/ebnerd/qwen25_7b/adapter
  dtype: bfloat16              # resolve_adapter keeps this entry's keys, so the base's dtype is repeated
  family: chatml
  max_model_len: 4096
  listwise: false
  trust_remote_code: false
  vllm:
    tensor_parallel_size: 1
