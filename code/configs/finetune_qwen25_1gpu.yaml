# Qwen2.5-7B-Instruct, 1-GPU variant of finetune.yaml (ada-sanjith, qos=low). Same hyperparameters as
# the Llama-2 run; base_model, batch 2 x 16 accumulation (same effective batch of 32) and fp16
# embeddings differ (the latter two for memory: the first pilot ran out of GPU memory).
# QLoRA fine-tuning (coldrank.finetune.train; design.md "Fine-tuning experiment").
# Li et al. (Sec. 3.2.2) fix only "QLoRA, 4-bit, 1 epoch"; the rest are standard QLoRA values.
base_model: qwen25_7b_fp16          # models.yaml key: full-precision weights, quantized to 4 bit at load

quant:
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: float16            # 2080 Ti (sm_75) has no bf16
  keep_embeddings_fp16: true        # frozen embeddings / lm_head stay fp16 (Qwen2.5: 152k vocab, else OOM)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 1
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch: 2
  grad_accum: 16                    # effective batch 1 GPU x 2 x 16 = 32 (same as 4 GPUs x 4 x 2)
  weight_decay: 0.0
  max_grad_norm: 0.3
  seed: 42
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
