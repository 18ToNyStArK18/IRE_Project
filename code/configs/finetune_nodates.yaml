# QLoRA fine-tuning (coldrank.finetune.train), dates-hidden control (coldrank.finetune.sft_data
# --variant nodates; design.md). Identical to finetune.yaml except for the data variant.
# Li et al. (Sec. 3.2.2) fix only "QLoRA, 4-bit, 1 epoch"; the rest are standard QLoRA values.
base_model: llama2_7b_fp16          # models.yaml key: full-precision weights, quantized to 4 bit at load
sft_variant: nodates                # SFT prompts with every date removed; output <base>_nodates/

quant:
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: float16            # 2080 Ti (sm_75) has no bf16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 1
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch: 4
  grad_accum: 2                     # effective batch 4 GPUs x 4 x 2 = 32
  weight_decay: 0.0
  max_grad_norm: 0.3
  seed: 42
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
